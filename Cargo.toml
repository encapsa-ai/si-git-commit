[package]
name = "si-git-commit"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Encapsa AI <dev@encapsa.ai>"]
license = "MIT OR Apache-2.0"
description = "Super Intelligent Git Commit — AI-powered git commit messages and workflow automation with modern model support"
repository = "https://github.com/encapsa-ai/si-git-commit"
documentation = "https://docs.rs/si-git-commit"
homepage = "https://github.com/encapsa-ai/si-git-commit"
keywords = ["git", "ai", "cli", "llm", "commit"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "ghsi"
path = "src/bin/ghsi.rs"

# Alias so `cargo install si-git-commit` also provides the long name.
[[bin]]
name = "si-git-commit"
path = "src/bin/ghsi.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
